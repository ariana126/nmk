<!--
  `novalidate` is mandatory, not stylistic. The [formField] directive writes real `required` and
  `minlength` attributes onto these inputs, so without it the browser runs its own constraint
  validation, blocks the submit event and shows a native bubble — and the accessible error region
  below never renders. jsdom does not enforce constraint validation, so the unit tests stay green
  either way; this only breaks in a real browser.
-->
<form class="card stack" novalidate (submit)="onSubmit($event)">
  <div class="stack--tight stack">
    <p class="eyebrow">Log in</p>
    <h1>Welcome back</h1>
  </div>

  @if (justCreated()) {
    <p class="alert alert--notice" role="status">Your account is ready. Log in to continue.</p>
  }

  <!--
    Present in the DOM at all times, with only its content toggled. A role="alert" element inserted
    together with its text is announced unreliably; a live region that gains content is not.
    tabindex="-1" so focus can be moved here when the failure belongs to no single field.
  -->
  <div class="alert alert--danger" role="alert" id="login-alert" tabindex="-1">
    @if (formErrors().length > 0) {
      <span>{{ formErrors()[0] }}</span>
    }
  </div>

  <app-text-field
    [field]="f.email"
    name="email"
    label="Email address"
    type="email"
    autocomplete="email"
  />

  <app-text-field
    [field]="f.password"
    name="password"
    label="Password"
    type="password"
    autocomplete="current-password"
  />

  <button class="button button--primary" type="submit" [disabled]="f().submitting()">
    {{ f().submitting() ? 'Logging in…' : 'Log in' }}
  </button>

  <!--
    After the button, not beside the password field: it is the way out of this page rather than
    part of filling it in, and putting it last keeps the tab order matching the reading order of
    "try to log in, and here is what to do if you cannot".
  -->
  <p class="switch"><a routerLink="/forgot-password">Forgot your password?</a></p>

  <p class="switch">No account yet? <a routerLink="/sign-up">Create one</a></p>
</form>
