<!--
  `novalidate` is mandatory, not stylistic. The [formField] directive writes a real `required`
  attribute onto this input, so without it the browser runs its own constraint validation, blocks
  the submit event and shows a native bubble — and the accessible error region below never renders.
  jsdom does not enforce constraint validation, so the unit tests stay green either way; this only
  breaks in a real browser.
-->
<form class="card stack" novalidate (submit)="onSubmit($event)">
  <div class="stack--tight stack">
    <p class="eyebrow">Forgot password</p>
    <h1>Reset your password</h1>
    <p class="prose lede">
      Tell us the address you signed up with and we will email you a link to choose a new password.
    </p>
  </div>

  <!--
    Both banners live inside the form, and both are present in the DOM at all times with only their
    content toggled: a live region inserted together with its text is announced unreliably, where
    one that gains content is not. tabindex="-1" so focus can be moved to whichever one spoke.
  -->
  <div class="alert alert--notice" role="status" id="forgot-password-status" tabindex="-1">
    @if (confirmation() !== '') {
      <span>{{ confirmation() }}</span>
    }
  </div>

  <div class="alert alert--danger" role="alert" id="forgot-password-alert" tabindex="-1">
    @if (formErrors().length > 0) {
      <span>{{ formErrors()[0] }}</span>
    }
  </div>

  <app-text-field
    [field]="f.email"
    name="email"
    label="Email address"
    type="email"
    autocomplete="email"
  />

  <button class="button button--primary" type="submit" [disabled]="f().submitting()">
    {{ f().submitting() ? 'Sending the link…' : 'Send reset link' }}
  </button>

  <p class="switch">Remembered it? <a routerLink="/login">Log in</a></p>
</form>
